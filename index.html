<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>바코드 리더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --surface-2: #EDF0F4;
    --border: #D8DEE6;
    --text: #1A1F26;
    --text-muted: #5B6472;
    --accent: #049775;
    --accent-soft: #E3F5EF;
    --accent-contrast: #FFFFFF;
    --danger: #C4383B;
    --danger-soft: #FBE9E8;
    --laser: #FF3B3B;
    --mono-bg: #12161C;
    --mono-panel: #191F27;
    --mono-text: #E8ECF1;
    --mono-muted: #7C879A;
    --font-display: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1115;
      --surface: #161A21;
      --surface-2: #1D222B;
      --border: #2A303B;
      --text: #E8ECF1;
      --text-muted: #8B93A1;
      --accent: #1FE3B0;
      --accent-soft: #123028;
      --accent-contrast: #062019;
      --danger: #FF6B6E;
      --danger-soft: #3A1A1B;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0F1115;
    --surface: #161A21;
    --surface-2: #1D222B;
    --border: #2A303B;
    --text: #E8ECF1;
    --text-muted: #8B93A1;
    --accent: #1FE3B0;
    --accent-soft: #123028;
    --accent-contrast: #062019;
    --danger: #FF6B6E;
    --danger-soft: #3A1A1B;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .brand h1 {
    font-size: 13px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 0;
    font-size: 9pt;
    color: var(--text-muted);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
  }

  #db-badge {
    font-size: 9px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  #db-badge.is-error {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, color .15s ease;
  }

  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.is-stop { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  main {
    flex: 1;
    padding: 8px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* ---- Camera / scan area ---- */

  .scan-frame {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: var(--mono-bg);
    aspect-ratio: 4.85;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 12px 28px -18px rgba(0,0,0,0.5);
  }

  #interactive {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #interactive video, #interactive canvas {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }

  .scan-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.5) 100%);
    opacity: 0;
    transition: opacity .25s ease;
  }

  .scan-frame.is-live::before { opacity: 1; }

  .placeholder {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 4px;
    text-align: center;
    color: var(--mono-muted);
  }

  .placeholder svg { color: var(--accent); opacity: 0.9; }
  .placeholder p { margin: 0; font-size: 9px; line-height: 1.25; color: #C3CAD4; }
  .placeholder.error { color: var(--danger); }
  .placeholder.error p { color: #F0B9BA; }

  .scan-frame.is-live .placeholder { display: none; }

  .laser-track {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    pointer-events: none;
  }

  .scan-frame.is-live .laser-track { display: block; }

  .laser-line {
    position: absolute;
    left: 22%;
    right: 22%;
    top: 50%;
    height: 2px;
    transform: translateY(-1px);
    background: var(--laser);
    box-shadow: 0 0 8px 1px var(--laser), 0 0 22px 4px rgba(255,59,59,0.55);
    animation: laser-pulse 1.6s ease-in-out infinite;
  }

  @keyframes laser-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .laser-frame {
    position: absolute;
    left: 22%;
    right: 22%;
    top: 50%;
    height: 19px;
    transform: translateY(-9.5px);
    border-left: 2px solid rgba(255,59,59,0.9);
    border-right: 2px solid rgba(255,59,59,0.9);
  }

  .readout-chip {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, calc(-50% - 11px));
    max-width: 88%;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(18, 22, 28, 0.88);
    border: 1px solid rgba(255,255,255,0.08);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--mono-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color .15s ease, border-color .15s ease;
  }

  .readout-chip.has-value {
    color: #fff;
    border-color: rgba(31,227,176,0.5);
  }

  .readout-chip.flash {
    animation: chip-flash .5s ease;
  }

  @keyframes chip-flash {
    0% { background: rgba(31,227,176,0.35); }
    100% { background: rgba(18, 22, 28, 0.88); }
  }

  .readout-chip.chip-miss {
    color: #FF9B9D;
    border-color: rgba(255,107,110,0.5);
  }

  /* ---- Controls ---- */

  .shutter-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .shutter-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid var(--surface-2);
    background: var(--accent);
    color: var(--accent-contrast);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 14px -8px rgba(0,0,0,0.4);
    transition: transform .1s ease;
  }

  .shutter-btn:active { transform: scale(0.92); }
  .shutter-btn:disabled { opacity: 0.55; }

  .shutter-btn.is-scanning {
    background: var(--danger);
    animation: shutter-pulse 1s ease-in-out infinite;
  }

  @keyframes shutter-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(196,56,59,0.45); }
    50% { box-shadow: 0 0 0 8px rgba(196,56,59,0); }
  }

  .shutter-caption {
    font-size: 9px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .zoom-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px;
  }

  .zoom-row .zoom-label {
    font-size: 11px;
    color: var(--text-muted);
    flex: none;
    width: 12px;
    text-align: center;
  }

  .zoom-row input[type="range"] {
    flex: 1;
    min-width: 0;
    height: 20px;
    accent-color: var(--accent);
  }

  .manual-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .manual-row {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .manual-row input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 5px 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
  }

  .manual-row input:focus { outline: none; }
  .manual-row input::placeholder { color: var(--text-muted); font-family: var(--font-display); }

  .manual-row button {
    flex: none;
    border: none;
    border-radius: 7px;
    padding: 0 12px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .manual-suggestions {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 200px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .manual-suggestions .sg-hint {
    font-size: 9pt;
    color: var(--text-muted);
    padding: 3px 5px 1px;
  }

  .suggestion-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    border: none;
    background: var(--surface-2);
    border-radius: 7px;
    padding: 6px 10px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }

  .suggestion-row:active { transform: scale(0.99); }

  .suggestion-row .sg-key {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    flex: none;
  }

  .suggestion-row .sg-value {
    font-family: var(--font-mono);
    font-size: 9pt;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  /* ---- Readout panel (device screen look, stays dark in both themes) ---- */
  /* 바코드 스캔 값(#res-barcode)만 조금 크게, 나머지 라벨/값은 전부 9pt로 통일한다. */

  .panel-label {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0 0 3px;
    font-size: 9pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .readout-panel {
    background: var(--mono-bg);
    border-radius: 12px;
    padding: 2px;
  }

  .readout-row {
    padding: 5px 10px;
  }

  .readout-row + .readout-row {
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .readout-row .rr-label {
    font-size: 9pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--mono-muted);
    margin: 0 0 1px;
  }

  .readout-row .rr-value {
    font-family: var(--font-mono);
    font-size: 9pt;
    font-weight: 600;
    color: var(--mono-text);
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    margin: 0;
  }

  #res-barcode.rr-value {
    font-size: 11pt;
  }

  .readout-row .rr-value.is-empty {
    font-family: var(--font-display);
    font-weight: 400;
    color: var(--mono-muted);
  }

  .readout-row .rr-value.is-miss {
    color: #FF9B9D;
    font-weight: 500;
  }

  .readout-row .rr-value.is-hit {
    color: #6FF0C4;
  }

  .engine-note {
    font-size: 9pt;
    color: var(--text-muted);
    text-align: center;
    margin: 0;
  }

  footer {
    padding: 3px 12px 6px;
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line><line x1="7" y1="8" x2="7" y2="8"></line><line x1="11" y1="8" x2="11" y2="8"></line></svg>
      </span>
      <div>
        <h1>바코드 리더</h1>
        <p>라인에 맞추고 탭해서 스캔</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="db-badge">DB 불러오는 중…</span>
      <button class="icon-btn" id="toggle-btn" title="카메라 시작">
        <svg id="toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        <span id="toggle-label" class="sr-only">카메라 시작</span>
      </button>
    </div>
  </header>

  <main>
    <div class="scan-frame" id="scan-frame">
      <div id="interactive"></div>

      <div class="placeholder" id="placeholder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        <p>카메라 시작 후 버튼으로 스캔</p>
      </div>

      <div class="laser-track">
        <div class="laser-frame"></div>
        <div class="readout-chip" id="readout-chip">탭해서 스캔</div>
        <div class="laser-line"></div>
      </div>
    </div>

    <div class="shutter-wrap" id="shutter-wrap" hidden>
      <button class="shutter-btn" id="shutter-btn" aria-label="바코드 스캔">
        <svg id="shutter-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
      <span class="shutter-caption">탭해서 스캔</span>
    </div>

    <div class="zoom-row" id="zoom-row" hidden>
      <span class="zoom-label">－</span>
      <input type="range" id="zoom-slider" min="0" max="1" step="0.01" value="0" aria-label="카메라 줌">
      <span class="zoom-label">＋</span>
    </div>

    <p class="engine-note" id="engine-note" hidden></p>

    <div class="manual-group">
      <div class="manual-row">
        <input type="text" id="manual-input" placeholder="바코드 값 직접 입력 (예: N16-16, 51355)" autocomplete="off">
        <button id="manual-btn">조회</button>
      </div>
      <div class="manual-suggestions" id="manual-suggestions" hidden></div>
    </div>

    <div>
      <p class="panel-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        판독 결과
      </p>
      <div class="readout-panel">
        <div class="readout-row">
          <p class="rr-label">바코드 스캔 값</p>
          <p class="rr-value is-empty" id="res-barcode">아직 스캔된 값이 없습니다</p>
        </div>
        <div class="readout-row">
          <p class="rr-label">매칭된 시리얼 (S/N)</p>
          <p class="rr-value is-empty" id="res-serial">—</p>
        </div>
        <div class="readout-row">
          <p class="rr-label">MAC 주소</p>
          <p class="rr-value is-empty" id="res-mac">—</p>
        </div>
        <div class="readout-row">
          <p class="rr-label">Hostname</p>
          <p class="rr-value is-empty" id="res-hostname">—</p>
        </div>
      </div>
    </div>
  </main>

  <footer>카메라 전환 없이 후면 카메라 한 대로만 스캔합니다 · Barcode Reader</footer>
</div>

<script>
  // 바코드 태그 ↔ 시리얼(S/N) 매핑 데이터는 코드에 박아두지 않고 같은 폴더의
  // data.csv에서 불러온다 - 데이터만 갈아끼우면 코드를 건드릴 필요가 없다.
  let barcodeDatabase = {};
  const dbBadge = document.getElementById('db-badge');

  // 쌍따옴표로 감싼 필드 안의 콤마/개행까지 다루는 최소 CSV 파서.
  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some((v) => v !== '')) rows.push(row);
        row = [];
      } else {
        field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  async function loadDatabase() {
    try {
      const res = await fetch('data.csv', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = parseCsv(await res.text());
      const [header, ...body] = rows;
      const col = (name, fallback) => {
        const idx = header.indexOf(name);
        return idx >= 0 ? idx : fallback;
      };
      const tagCol = col('tag', 0);
      const serialCol = col('serial', 1);
      const macCol = col('mac', -1);
      const hostnameCol = col('hostname', -1);

      const db = {};
      body.forEach((r) => {
        const tag = (r[tagCol] || '').trim();
        const serial = (r[serialCol] || '').trim();
        if (!tag || !serial) return;
        db[tag] = {
          serial,
          mac: macCol >= 0 ? (r[macCol] || '').trim() : '',
          hostname: hostnameCol >= 0 ? (r[hostnameCol] || '').trim() : ''
        };
      });
      barcodeDatabase = db;
      dbBadge.textContent = 'DB ' + Object.keys(barcodeDatabase).length + '건';
      dbBadge.classList.remove('is-error');
    } catch (err) {
      console.error('data.csv 로드 실패:', err);
      dbBadge.textContent = 'DB 로드 실패';
      dbBadge.classList.add('is-error');
    }
  }

  loadDatabase();

  const scanFrame = document.getElementById('scan-frame');
  const interactiveEl = document.getElementById('interactive');
  const placeholder = document.getElementById('placeholder');
  const readoutChip = document.getElementById('readout-chip');
  const toggleBtn = document.getElementById('toggle-btn');
  const toggleIcon = document.getElementById('toggle-icon');
  const toggleLabel = document.getElementById('toggle-label');
  const shutterWrap = document.getElementById('shutter-wrap');
  const shutterBtn = document.getElementById('shutter-btn');
  const shutterIcon = document.getElementById('shutter-icon');
  const zoomRow = document.getElementById('zoom-row');
  const zoomSlider = document.getElementById('zoom-slider');
  const engineNote = document.getElementById('engine-note');
  const resBarcode = document.getElementById('res-barcode');
  const resSerial = document.getElementById('res-serial');
  const resMac = document.getElementById('res-mac');
  const resHostname = document.getElementById('res-hostname');

  const ICON_PLAY = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
  const ICON_STOP = '<rect x="5" y="5" width="14" height="14" rx="2"></rect>';
  const ICON_SHUTTER = '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>';

  // 화면의 스캔 라인 가이드(좌우 22% 여백)와 정확히 같은 영역만 잘라내서
  // 판독기에 넘긴다 - 화면에 다른 바코드가 붙어 있어도 그 영역 밖은 아예
  // 보이지 않으므로 엉뚱한 바코드가 잡히지 않고, 그 좁은 영역만 확대해서
  // 분석하는 효과가 있어 작은 바코드의 인식률도 함께 올라간다.
  const ROI = { xPct: 0.22, wPct: 0.56, yPct: 0.175, hPct: 0.65 };
  const ROI_MIN_WIDTH = 900;

  function getRoiCanvas() {
    const vw = videoEl && videoEl.videoWidth;
    const vh = videoEl && videoEl.videoHeight;
    if (!vw || !vh) return null;

    const sx = vw * ROI.xPct;
    const sy = vh * ROI.yPct;
    const sw = vw * ROI.wPct;
    const sh = vh * ROI.hPct;
    const scale = sw < ROI_MIN_WIDTH ? ROI_MIN_WIDTH / sw : 1;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(sw * scale);
    canvas.height = Math.round(sh * scale);
    canvas.getContext('2d').drawImage(videoEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  // Code 128은 문자+숫자+하이픈이 섞여도 정확히 읽히는 반면, QuaggaJS의
  // code_128_reader는 이런 혼합 바코드에서 종종 앞/뒤 문자를 놓친다.
  // 브라우저 네이티브 BarcodeDetector(Android Chrome)가 있으면 그걸 우선 쓰고,
  // 지원하지 않는 브라우저(iOS Safari 등)에서만 QuaggaJS로 폴백한다.
  const hasNativeDetector = 'BarcodeDetector' in window;
  let engine = null; // 'native' | 'quagga'
  let isScanning = false;
  let flashTimer = null;
  let missTimer = null;
  let cameraStream = null;
  let videoEl = null;
  let detector = null;
  let scanLoopTimer = null;
  let scanLoopDeadline = 0;
  let scanLoopActive = false;
  let activeVideoTrack = null;
  let zoomCaps = null;

  const SCAN_LOOP_INTERVAL = 350;
  const SCAN_LOOP_TIMEOUT = 20000;

  // MAC 주소 라벨은 콜론/하이픈 없이 12자리 16진수만 찍혀 나오는 경우가 많아
  // (예: F45424 68C940) data.csv에 저장된 "F4:54:24:68:C9:40"과 글자 그대로는
  // 다르다 - 구분자를 다 지우고 대문자 16진수만 남겨 비교해야 같은 주소로 인식된다.
  function normalizeMac(value) {
    return (value || '').toUpperCase().replace(/[^0-9A-F]/g, '');
  }

  // 스캔/입력된 값이 등록된 짧은 태그(키)일 수도, 그 태그가 가리키는 시리얼일
  // 수도, 장비에 붙은 MAC 주소나 Hostname이 직접 인쇄된 경우일 수도 있어
  // 넷 다 정확히 일치하는지 확인한다(MAC은 구분자 무시하고 비교).
  // 부분적으로만 비슷한 값은 여기서 걸러지지 않는다 - 호출부가 필요하면
  // searchDatabase()로 별도 처리한다.
  function findExactEntry(code) {
    const trimmed = (code || '').trim();
    if (!trimmed) return null;

    if (Object.prototype.hasOwnProperty.call(barcodeDatabase, trimmed)) {
      return { key: trimmed, entry: barcodeDatabase[trimmed] };
    }

    const keys = Object.keys(barcodeDatabase);

    const bySerial = keys.find((k) => barcodeDatabase[k].serial === trimmed);
    if (bySerial) return { key: bySerial, entry: barcodeDatabase[bySerial] };

    const normalizedInput = normalizeMac(trimmed);
    if (normalizedInput.length === 12) {
      const byMac = keys.find((k) => normalizeMac(barcodeDatabase[k].mac) === normalizedInput);
      if (byMac) return { key: byMac, entry: barcodeDatabase[byMac] };
    }

    const lowerTrimmed = trimmed.toLowerCase();
    const byHostname = keys.find((k) => {
      const hostname = barcodeDatabase[k].hostname;
      return hostname && hostname.toLowerCase() === lowerTrimmed;
    });
    if (byHostname) return { key: byHostname, entry: barcodeDatabase[byHostname] };

    return null;
  }

  function applyMatch(key, entry) {
    resBarcode.textContent = key;
    resBarcode.className = 'rr-value';
    resSerial.textContent = entry.serial || '—';
    resSerial.className = entry.serial ? 'rr-value is-hit' : 'rr-value is-empty';
    resMac.textContent = entry.mac || '등록된 정보 없음';
    resMac.className = entry.mac ? 'rr-value is-hit' : 'rr-value is-empty';
    resHostname.textContent = entry.hostname || '등록된 정보 없음';
    resHostname.className = entry.hostname ? 'rr-value is-hit' : 'rr-value is-empty';

    readoutChip.textContent = key;
    readoutChip.classList.add('has-value', 'flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => readoutChip.classList.remove('flash'), 500);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 대소문자 구분 없이, 태그/시리얼/MAC/Hostname 전부에서 부분 문자열을 찾는다.
  function searchDatabase(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return Object.entries(barcodeDatabase).filter(([key, entry]) => (
      key.toLowerCase().includes(q) ||
      (entry.serial || '').toLowerCase().includes(q) ||
      (entry.mac || '').toLowerCase().includes(q) ||
      (entry.hostname || '').toLowerCase().includes(q)
    ));
  }

  function hideSuggestions() {
    manualSuggestions.hidden = true;
    manualSuggestions.innerHTML = '';
  }

  function renderSuggestions(matches, query) {
    if (!matches.length) {
      hideSuggestions();
      return;
    }
    // 예전엔 8건까지만 보여줘서, 흔한 검색어(예: "STOCK")로 찾을 때 정작 찾는
    // 항목이 목록에 없는 것처럼 보이는 문제가 있었다 - 스크롤로 다 볼 수 있게
    // 상한을 크게 늘렸다.
    const shown = matches.slice(0, 60);
    const hint = matches.length > shown.length
      ? `"${escapeHtml(query)}" 일치 ${matches.length}건 중 ${shown.length}건 표시 (더 구체적으로 입력하면 좁혀집니다)`
      : `"${escapeHtml(query)}" 일치 ${matches.length}건 - 선택하세요`;

    manualSuggestions.innerHTML = '<div class="sg-hint">' + hint + '</div>' + shown.map(([key, entry]) => {
      const detail = [entry.serial, entry.hostname].filter(Boolean).join(' · ');
      return (
        '<button type="button" class="suggestion-row" data-key="' + escapeHtml(key) + '">' +
          '<span class="sg-key">' + escapeHtml(key) + '</span>' +
          '<span class="sg-value">' + escapeHtml(detail) + '</span>' +
        '</button>'
      );
    }).join('');
    manualSuggestions.hidden = false;

    manualSuggestions.querySelectorAll('.suggestion-row').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        manualInput.value = key;
        searchCommitted = true;
        applyMatch(key, barcodeDatabase[key]);
        hideSuggestions();
      });
    });
  }

  function showPlaceholder(message, isError) {
    placeholder.querySelector('p').innerHTML = message;
    placeholder.classList.toggle('error', !!isError);
    scanFrame.classList.remove('is-live');
  }

  function describeCameraError(err) {
    const name = err && err.name;
    if (!window.isSecureContext) {
      return 'HTTPS 연결이 아니라 카메라를 쓸 수 없습니다.';
    }
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      return '카메라 권한이 거부됐습니다. 설정에서 허용해주세요.';
    }
    if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      return '사용 가능한 카메라를 찾을 수 없습니다.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return '다른 앱이 카메라 사용 중입니다.';
    }
    return '카메라를 시작할 수 없습니다.';
  }

  function handleManualSearch() {
    const trimmed = manualInput.value.trim();
    if (!trimmed) return;
    searchCommitted = true;

    // 1) 태그(키) 또는 시리얼(값)과 정확히 일치하면 바로 확정
    const exact = findExactEntry(trimmed);
    if (exact) {
      applyMatch(exact.key, exact.entry);
      hideSuggestions();
      return;
    }

    // 2) 완전히 일치하는 값이 없으면 부분 문자열로 유사/동일 항목을 찾는다
    const matches = searchDatabase(trimmed);
    if (matches.length === 1) {
      applyMatch(matches[0][0], matches[0][1]);
      hideSuggestions();
    } else if (matches.length > 1) {
      renderSuggestions(matches, trimmed);
    } else {
      hideSuggestions();
      resBarcode.textContent = trimmed;
      resBarcode.className = 'rr-value';
      resSerial.textContent = '일치하는 바코드가 없습니다';
      resSerial.className = 'rr-value is-miss';
      resMac.textContent = '—';
      resMac.className = 'rr-value is-empty';
      resHostname.textContent = '—';
      resHostname.className = 'rr-value is-empty';
    }
  }

  const manualInput = document.getElementById('manual-input');
  const manualSuggestions = document.getElementById('manual-suggestions');
  // 검색을 한 번 확정한 뒤 입력창을 다시 탭하면, 새로 입력할 수 있도록
  // 이전 검색어를 자동으로 지워준다(매번 직접 지우고 입력하는 수고를 없앤다).
  let searchCommitted = false;

  document.getElementById('manual-btn').addEventListener('click', handleManualSearch);
  manualInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleManualSearch();
  });
  manualInput.addEventListener('focus', () => {
    if (searchCommitted) {
      manualInput.value = '';
      searchCommitted = false;
      hideSuggestions();
    }
  });

  // 입력하는 동안에도 두 글자 이상이면 실시간으로 후보를 보여준다
  manualInput.addEventListener('input', () => {
    const q = manualInput.value.trim();
    if (q.length < 2 || barcodeDatabase[q]) {
      hideSuggestions();
      return;
    }
    renderSuggestions(searchDatabase(q), q);
  });

  function showScanMiss() {
    readoutChip.classList.remove('has-value');
    readoutChip.classList.add('chip-miss');
    readoutChip.textContent = '인식 실패 · 다시 시도하세요';
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    clearTimeout(missTimer);
    missTimer = setTimeout(() => {
      readoutChip.classList.remove('chip-miss');
      readoutChip.textContent = '탭해서 스캔';
    }, 1400);
  }

  // 헤더 아이콘 버튼으로 축소돼 있어 보이는 글자가 없으니, hover 툴팁(title)과
  // 스크린 리더용 sr-only 라벨을 상태에 맞춰 함께 갱신해준다.
  function markLive() {
    isScanning = true;
    scanFrame.classList.add('is-live');
    toggleBtn.classList.add('is-stop');
    toggleBtn.title = '카메라 중지';
    toggleIcon.innerHTML = ICON_STOP;
    toggleLabel.textContent = '카메라 중지';
    shutterWrap.hidden = false;
    readoutChip.textContent = '탭해서 스캔';
    readoutChip.classList.remove('has-value', 'chip-miss');
  }

  function resetToggle() {
    isScanning = false;
    toggleBtn.classList.remove('is-stop');
    toggleBtn.title = '카메라 시작';
    toggleIcon.innerHTML = ICON_PLAY;
    toggleLabel.textContent = '카메라 시작';
    shutterWrap.hidden = true;
  }

  function setEngineNote(text) {
    engineNote.textContent = text;
    engineNote.hidden = !text;
  }

  // 지원 기기에서는 카메라 자체의 광학/디지털 줌을 걸어 확대된 상태로 스캔을
  // 시작한다 - 작은 바코드(특히 장비 뒷면의 자그마한 MAC 주소 라벨)가
  // 프레임에서 차지하는 비중을 실제로 키워줘서 인식률을 추가로 높여준다.
  // 자동으로 건 배율이 라벨 크기에 안 맞을 수 있으니, 슬라이더도 함께
  // 노출해서 사용자가 직접 더 당기거나 풀 수 있게 한다. 이 API를 지원하지
  // 않는 브라우저(iOS Safari 등)에서는 슬라이더째로 조용히 숨겨진다.
  async function applyStartupZoom(stream) {
    const [track] = stream.getVideoTracks();
    activeVideoTrack = track || null;
    zoomCaps = null;
    zoomRow.hidden = true;
    if (!track || typeof track.getCapabilities !== 'function') return;

    try {
      const caps = track.getCapabilities();
      if (!caps.zoom) return;
      zoomCaps = caps.zoom;

      const target = Math.min(caps.zoom.max, Math.max(caps.zoom.min, caps.zoom.min + (caps.zoom.max - caps.zoom.min) * 0.5));
      await track.applyConstraints({ advanced: [{ zoom: target }] });

      zoomSlider.min = String(caps.zoom.min);
      zoomSlider.max = String(caps.zoom.max);
      zoomSlider.step = String(caps.zoom.step || (caps.zoom.max - caps.zoom.min) / 20 || 0.1);
      zoomSlider.value = String(target);
      zoomRow.hidden = false;
    } catch (err) {
      // 줌 미지원/실패는 치명적이지 않음 - 기본 배율로 계속 진행
    }
  }

  zoomSlider.addEventListener('input', () => {
    if (!activeVideoTrack || !zoomCaps) return;
    activeVideoTrack.applyConstraints({ advanced: [{ zoom: Number(zoomSlider.value) }] }).catch(() => {});
  });

  // 카메라 미리보기는 항상 이 함수 하나로 켠다 - 연속 인식 루프는 돌리지 않고,
  // 셔터 버튼을 누르고 있는 동안에만 반복 판독한다(오탐/값 요동 방지).
  async function startScanner() {
    if (isScanning) return;

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 3840 },
          height: { ideal: 2160 },
          focusMode: 'continuous'
        },
        audio: false
      });
    } catch (err) {
      console.error(err);
      showPlaceholder(describeCameraError(err), true);
      return;
    }

    await applyStartupZoom(cameraStream);

    videoEl = document.createElement('video');
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('muted', '');
    videoEl.muted = true;
    videoEl.autoplay = true;
    videoEl.srcObject = cameraStream;
    interactiveEl.innerHTML = '';
    interactiveEl.appendChild(videoEl);

    try {
      await videoEl.play();
    } catch (err) {
      // Safari 등에서 autoplay가 막히면 첫 터치 이후 자동 재생됨 - 치명적이지 않음
    }

    // Code 128처럼 문자+숫자+하이픈이 섞인 바코드는 브라우저 네이티브
    // BarcodeDetector가 QuaggaJS보다 훨씬 정확하게 읽는다. 지원하는
    // 브라우저(Android Chrome 등)에서는 그걸 쓰고, 없으면 셔터를 누를
    // 때 캡처한 정지 프레임을 QuaggaJS의 decodeSingle로 판독한다.
    if (hasNativeDetector) {
      try {
        detector = new BarcodeDetector({
          formats: ['code_128', 'ean_13', 'ean_8', 'code_39', 'upc_a', 'upc_e']
        });
        engine = 'native';
        setEngineNote('');
      } catch (err) {
        detector = null;
        engine = 'quagga';
        setEngineNote('호환 모드로 스캔 중 (구형 브라우저)');
      }
    } else {
      engine = 'quagga';
      setEngineNote('호환 모드로 스캔 중 (구형 브라우저)');
    }

    markLive();
  }

  function stopScanLoop() {
    scanLoopActive = false;
    clearTimeout(scanLoopTimer);
    scanLoopTimer = null;
    shutterBtn.classList.remove('is-scanning');
    shutterIcon.innerHTML = ICON_SHUTTER;
  }

  function stopScanner() {
    if (!isScanning) return;
    stopScanLoop();
    if (cameraStream) {
      cameraStream.getTracks().forEach((t) => t.stop());
      cameraStream = null;
    }
    videoEl = null;
    detector = null;
    engine = null;
    activeVideoTrack = null;
    zoomCaps = null;
    zoomRow.hidden = true;
    interactiveEl.innerHTML = '';
    resetToggle();
    showPlaceholder('카메라 시작 후 버튼으로 스캔', false);
    setEngineNote('');
  }

  // 프레임 한 장(ROI로 잘라낸 캔버스)을 판독해서 성공 시 원문 코드 문자열,
  // 실패 시 null을 반환한다. 엔진 종류와 무관하게 같은 인터페이스로 쓴다.
  function decodeCanvas(canvas) {
    if (engine === 'native' && detector) {
      return detector.detect(canvas)
        .then((codes) => (codes && codes.length > 0 ? codes[0].rawValue : null))
        .catch(() => null);
    }
    return new Promise((resolve) => {
      Quagga.decodeSingle({
        src: canvas.toDataURL('image/png'),
        numOfWorkers: 0,
        inputStream: { size: Math.max(canvas.width, canvas.height) },
        decoder: { readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'code_39_reader'] },
        // 기본값(halfSample:true)은 위치 탐색 단계에서 해상도를 절반으로
        // 줄여버려서 작은 바코드를 놓치기 쉽다 - 이미 ROI로 크롭한 작은
        // 이미지라 성능 여유가 있으니 원본 해상도 그대로 탐색한다.
        locator: { patchSize: 'large', halfSample: false },
        locate: true
      }, (result) => {
        resolve((result && result.codeResult && result.codeResult.code) || null);
      });
    });
  }

  function runScanAttempt() {
    if (!scanLoopActive || !isScanning) return;
    if (Date.now() > scanLoopDeadline) {
      stopScanLoop();
      showScanMiss();
      return;
    }

    const roiCanvas = getRoiCanvas();
    const decodePromise = roiCanvas ? decodeCanvas(roiCanvas) : Promise.resolve(null);

    decodePromise.then((code) => {
      if (!scanLoopActive || !isScanning) return; // 대기 중 취소됐거나 카메라가 꺼졌으면 무시

      const match = code ? findExactEntry(code) : null;
      if (match) {
        stopScanLoop();
        clearTimeout(missTimer);
        readoutChip.classList.remove('chip-miss');
        applyMatch(match.key, match.entry);
        if (navigator.vibrate) navigator.vibrate(120);
        return;
      }
      scanLoopTimer = setTimeout(runScanAttempt, SCAN_LOOP_INTERVAL);
    });
  }

  // 셔터를 한 번 누르면 일치하는 값을 찾을 때까지(최대 SCAN_LOOP_TIMEOUT) 계속
  // 반복 판독하고, 찾는 즉시 멈춘다. 스캔 중 다시 누르면 취소된다.
  function captureAndScan() {
    if (!isScanning || !videoEl) return;

    if (scanLoopActive) {
      stopScanLoop();
      readoutChip.classList.remove('has-value', 'chip-miss');
      readoutChip.textContent = '탭해서 스캔';
      return;
    }

    scanLoopActive = true;
    shutterBtn.classList.add('is-scanning');
    shutterIcon.innerHTML = ICON_STOP;
    clearTimeout(missTimer);
    readoutChip.classList.remove('has-value', 'chip-miss');
    readoutChip.textContent = '스캔 중…';

    scanLoopDeadline = Date.now() + SCAN_LOOP_TIMEOUT;
    runScanAttempt();
  }

  toggleBtn.addEventListener('click', () => {
    if (isScanning) stopScanner();
    else startScanner();
  });

  shutterBtn.addEventListener('click', captureAndScan);
</script>
</body>
</html>
